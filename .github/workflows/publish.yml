name: Publish to Visual Studio Marketplace

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & package without publishing to Marketplace)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Roslyn Host
        run: npm run build:roslyn

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build extension bundle
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run }}
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "Publishing ${VSIX_FILE} to Visual Studio Marketplace..."
          npx vsce publish --packagePath "${VSIX_FILE}" -p "${{ secrets.VSCE_PAT }}"

      - name: Upload VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: di-container-mapper-vsix
          path: '*.vsix'
